# fly.toml app configuration file generated for herbalife on 2026-11-10T22:01:22-08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'concienciasalud'
primary_region = 'lax'

[build]
  dockerfile = "Miherbalife/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
