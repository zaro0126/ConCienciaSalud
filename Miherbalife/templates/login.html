{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Administración</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4 border-0" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <div class="fs-1 text-success mb-2"><i class="bi bi-shield-lock"></i></div>
            <h4 class="fw-bold text-dark">Acceso Administrativo</h4>
            <p class="text-muted small">Ingresa tus credenciales para gestionar la tienda</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <!-- Alerta si las credenciales son incorrectas -->
            {% if form.errors %}
                <div class="alert alert-danger p-2 small text-center mb-3">
                    Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold small">Usuario</label>
                <input type="text" name="username" class="form-control" id="id_username" required autofocus placeholder="Nombre de usuario">
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label fw-semibold small">Contraseña</label>
                <input type="password" name="password" class="form-control" id="id_password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-bold mt-2">Iniciar Sesión</button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'catalogo' %}" class="text-decoration-none small text-muted">
                <i class="bi bi-arrow-left"></i> Volver a la tienda online
            </a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
