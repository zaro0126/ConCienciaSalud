<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión - Carrusel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión del Carrusel</h2>
            <div>
                <a href="{% url 'agregar_carrusel' %}" class="btn btn-warning text-white">Agregar Imagen</a>
                <a href="{% url 'dashboard_admin' %}" class="btn btn-outline-secondary">Volver al Dashboard</a>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Subtítulo</th>
                            <th>Activo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in elementos %}
                        <tr>
                            <td>{{ item.titulo }}</td>
                            <td>{{ item.subtitulo }}</td>
                            <td>{% if item.activo %}<span class="badge bg-success">Activo</span>{% else %}<span class="badge bg-secondary">Inactivo</span>{% endif %}</td>
                            <td>
                                <a href="{% url 'editar_carrusel' item.id %}" class="btn btn-sm btn-primary">Editar</a>
                                <a href="{% url 'eliminar_carrusel' item.id %}" class="btn btn-sm btn-danger">Eliminar</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="4" class="text-center text-muted">No hay imágenes en el carrusel.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
