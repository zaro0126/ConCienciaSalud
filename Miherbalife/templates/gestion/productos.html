<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Gestión de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons para la lupa del buscador -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h2>Gestión de Productos</h2>
            <div>
                <a href="{% url 'agregar_producto' %}" class="btn btn-success">Agregar Producto</a>
                <a href="{% url 'dashboard_admin' %}" class="btn btn-outline-secondary">Volver al Dashboard</a>
            </div>
        </div>

        <!-- Buscador en tiempo real para tus 78+ productos -->
        <div class="row mb-3">
            <div class="col-md-5 ms-auto">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="buscadorProductos" class="form-control" placeholder="Buscar producto por nombre o categoría..." onkeyup="filtrarProductos()">
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle mb-0" id="tablaProductos">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for producto in productos %}
                            <tr>
                                <td>{{ producto.nombre }}</td>
                                <td>{{ producto.categoria.nombre }}</td>
                                <td>${{ producto.precio }}</td>
                                <td>
                                    <a href="{% url 'editar_producto' producto.id %}" class="btn btn-sm btn-primary">Editar</a>
                                    <a href="{% url 'eliminar_producto' producto.id %}" class="btn btn-sm btn-danger">Eliminar</a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">No hay productos registrados.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de filtrado en tiempo real -->
    <script>
        function filtrarProductos() {
            let input = document.getElementById('buscadorProductos');
            let filtro = input.value.toLowerCase();
            let tabla = document.getElementById('tablaProductos');
            let filas = tabla.getElementsByTagName('tr');

            for (let i = 1; i < filas.length; i++) {
                let fila = filas[i];
                let textoFila = fila.textContent || fila.innerText;

                if (textoFila.toLowerCase().includes(filtro)) {
                    fila.style.display = "";
                } else {
                    fila.style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
